services:
  devcontainer:
    container_name: ${PROJECT_FOLDER_NAME}-devcontainer
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - .:/workspaces/${PROJECT_FOLDER_NAME}:cached
    networks:
      - monorepo-network
    command: sleep infinity
  
  db:
    container_name: ${DB_CONTAINER_NAME}
    image: postgres:16
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - monorepo-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER}", "-d", "${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    
volumes:
  postgres_data:

networks:
  monorepo-network:
    driver: bridge